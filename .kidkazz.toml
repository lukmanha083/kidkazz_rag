[storage]
store_type = "helix"
helix_port = 6969
helix_local = true

[embeddings]
embedder_type = "mock"
model_name = "text-embedding-3-small"

[chunking]
level_1_size = 2048
level_2_size = 512
overlap = 256

[output]
format = "human"
color = true

[inbox]
path = "/tmp/kidkazz_inbox_f0owzi47"
output_path = "~/.kidkazz/output"
post_action = "move"
recursive = false
processed_dir = "~/.kidkazz/processed"

[cloud_sync]
remote = "gdrive"
path = "kidkazz_inbox"

[concepts]
enabled = true
provider = "anthropic/claude-sonnet-4-20250514"
max_concepts_per_chunk = 10
