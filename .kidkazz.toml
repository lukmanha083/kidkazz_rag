[storage]
store_type = "mock"
helix_port = 6969
helix_local = true

[embeddings]
embedder_type = "mock"
model_name = "BAAI/bge-small-en-v1.5"

[chunking]
level_1_size = 2048
level_2_size = 512
overlap = 256

[output]
format = "human"
color = true

[inbox]
path = "/tmp/kidkazz_inbox_0c02txb2"
output_path = "~/.kidkazz/output"
post_action = "move"
recursive = false
processed_dir = "~/.kidkazz/processed"
