[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kidkazz-rag"
version = "0.1.0"
description = "RAG system for converting PDF textbooks to searchable knowledge bases"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KidKazz"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
converter = [
    "marker-pdf>=0.2.0",
    "docling>=1.0.0",
    "nougat-ocr>=0.1.0",
]
chunker = [
    "fastembed>=0.2.0",
]
helixdb = [
    "helix-py>=0.1.0",
]
mcp = [
    "mcp>=1.2.0",
]
reducto = [
    "reductoai>=0.1.0",
    "python-dotenv>=1.0.0",
]
openai = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
]
all = [
    "fastembed>=0.2.0",
    "helix-py>=0.1.0",
    "mcp>=1.2.0",
    "reductoai>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.scripts]
kidkazz = "src.cli:cli"
kidkazz-mcp = "src.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "helix: marks tests requiring real Helix-DB server (deselect with '-m \"not helix\"')",
    "mcp: marks MCP-related tests",
    "fastembed: marks tests requiring FastEmbed (slow)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
